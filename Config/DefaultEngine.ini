; ---------------------------------------------------------------------------------------------
; Network emulation profiles (applied on the CLIENT only, both directions).
; Target RTT is split in half between outgoing (PktLag*) and incoming (PktIncomingLag*).
; Jitter = Min/Max range per direction; loss = percent per direction.
; Every key is set explicitly so engine defaults for same-named sections cannot leak in.
; Keep names in sync with Scripts/StartClient.ps1 (-NetEmulation ValidateSet).
; ---------------------------------------------------------------------------------------------
[PacketSimulationProfile.Good]
; RTT ~30ms, no jitter, no loss
PktLag=0
PktLagVariance=0
PktJitter=0
PktLagMin=15
PktLagMax=15
PktIncomingLagMin=15
PktIncomingLagMax=15
PktLoss=0
PktIncomingLoss=0
PktBufferBloatInMS=0
PktIncomingBufferBloatInMS=0

[PacketSimulationProfile.Average]
; RTT 90-110ms (100 +-10), 1% loss each direction
PktLag=0
PktLagVariance=0
PktJitter=0
PktLagMin=45
PktLagMax=55
PktIncomingLagMin=45
PktIncomingLagMax=55
PktLoss=1
PktIncomingLoss=1
PktBufferBloatInMS=0
PktIncomingBufferBloatInMS=0

[PacketSimulationProfile.Bad]
; RTT 176-224ms (200 +-24), 5% loss each direction
PktLag=0
PktLagVariance=0
PktJitter=0
PktLagMin=88
PktLagMax=112
PktIncomingLagMin=88
PktIncomingLagMax=112
PktLoss=5
PktIncomingLoss=5
PktBufferBloatInMS=0
PktIncomingBufferBloatInMS=0

[/Script/Engine.NetworkSettings]
